<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBB Login</title>

    <!-- Página de estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">

    <!-- Conexão com o Supabase pela API JavaScript oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <div class="logo">
        <img src="images/logo.png" alt="Logo horizontal">
    </div>

    <div>
        <form>
            <fieldset>
                <label for="codigo-setor">Cod. Setor</label>
                <input type="text" id="codigo-setor">
            </fieldset>

            <fieldset>
                <label for="senha">Senha</label>
                <input type="password" id="senha">
            </fieldset>

            <a href="dashboard.html">
               Acessar
            </a>
        </form>
    </div>

    <!-- Ao final, chama o script JS -->
    <script src="js/script.js"></script>
</body>
</html>
