<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBB Dashboard</title>

    <!-- Página de estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Conexão com o Supabase pela API JavaScript oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <div id="header">
        <img src="images/logo.png" class="img-topo" alt="Logo horizontal">
        <div>
            <button>Em andamento</button>
            <button>Finalizados</button>
            <button>Futuros</button>
        </div>
        <img src="images/user-azul.png" class="img-topo" alt="Logo de usuário">
    </div>

    <div id="main">
        <div id="menu-lateral">
            <h1>Clientes</h1>
            <ul>
                <li><a href="dashboard2.html">Amazon</a></li>
                <li><a href="dashboard2.html">C&A</a></li>
            </ul>
            <a href="index.html">
            <img src="images/sair.png" id="porta" alt="Porta (sair)">
            </a>
        </div>

        <div id="conteudo-principal">
            <div id="abas">
                <button>Operacional</button>
            </div>

            <div id="dashboard">
                <div id="operacional-geral">
                    <div class="card">
                        <h2>Ranking de países clientes</h2>
                        <img src="https://placehold.co/200x200" alt="Gráfico de barras - Top 3">
                    </div>

                    <div class="card">
                        <h2>Custos extras</h2>
                        <img src="https://placehold.co/350x200" alt="Gráfico de linha">
                    </div>

                    <div class="card">
                        <h2>Histórico de prazos</h2>
                        <table>
                            <tr><th>Nome</th><th>Data</th><th>Status</th></tr>
                            <tr><td>C&A Varejo</td><td></td><td><img src="" alt="Status"></td></tr>
                            <tr><td>Amazon Shopping</td><td></td><td><img src="" alt="Status"></td></tr>
                            <tr><td>C&A Varejo</td><td></td><td><img src="" alt="Status"></td></tr>
                            <tr><td>C&A Varejo</td><td></td><td><img src="" alt="Status"></td></tr>
                        </table>
                    </div>

                    <div class="card">
                        <h2>Top localidades</h2>
                        <ul>
                            <li>China</li>
                            <li>Egito</li>
                            <li>EUA</li>
                            <li>Canadá</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>







    <!-- Seção que será manipulada pelo JS para exibir o resultado -->
    <div id="resultado"></div>

    <!-- Ao final, chama o script JS -->
    <script src="js/script.js"></script>
</body>
</html>
