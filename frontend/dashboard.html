<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBB Dashboard</title>

    <!-- Página de estilos -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Conexão com o Supabase pela API JavaScript oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <div id="header" class="white">
        <a href="dashboard.html">
            <img src="images/logo.png" class="img-topo" alt="Logo horizontal">
        </a>
        <div>
            <span>Em andamento</span>
            <span>Finalizados</span>
            <span>Futuros</span>
        </div>
        <img src="images/user-azul.png" class="img-topo" alt="Logo de usuário">
    </div>

    <div id="main">
        <div id="menu-lateral" class="white">
            <h1>Clientes</h1>
            <div class="ul">
                <a class="li" href="dashboard2.html?cliente=amazon">Amazon</a>
                <a class="li" href="dashboard2.html?cliente=cea">C&A</a>
            </div>
            <a href="index.html" class="sair">
                <img src="images/sair.png" id="porta" alt="Porta (sair)">
            </a>
        </div>

        <div id="conteudo-principal" class="blue">
            <div id="abas">
                <h3 class="white">Operacional</h3>
            </div>

            <div id="dashboard" class="white">
                <div id="operacional-geral">
                    <div class="card" style="min-width: 20%;">
                        <h2>Ranking de países clientes</h2>
                        <div id="grafico-ranking">
                            <img src="https://placehold.co/200x200" alt="Gráfico de barras - Top 3">
                        </div>
                    </div>

                    <div class="card" style="min-width: 50%;">
                        <h2>Custos extras</h2>
                        <div id="grafico-custos-extras">
                            <img src="https://placehold.co/350x200" alt="Gráfico de linha">
                        </div>
                    </div>

                    <div class="card" style="min-width: 50%;">
                        <h2>Histórico de prazos</h2>
                        <table>
                            <thead>
                                <tr><th>Nome</th><th>Data</th><th>Status</th></tr>
                            </thead>
                            <tbody id="tabela-historico-prazos">
                                <tr>
                                    <td colspan="3">Carregando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card" style="min-width: 25%;">
                        <h2>Top localidades</h2>
                        <ul id="top-localidades">
                            Carregando...
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>







    <!-- Seção que será manipulada pelo JS para exibir o resultado -->
    <div id="resultado"></div>

    <!-- Ao final, chama o script JS -->
    <script src="js/script.js"></script>
</body>
</html>
